name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wmv
          POSTGRES_PASSWORD: wmv
          POSTGRES_DB: wmv_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wmv -d wmv_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies (root + server)
        run: |
          npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Validate Drizzle migration metadata
        run: npm run db:check

      - name: Apply Drizzle migrations on clean Postgres
        env:
          DATABASE_URL: postgresql://wmv:wmv@localhost:5432/wmv_ci
        run: npm run db:migrate

      - name: Typecheck (frontend + server)
        run: npm run typecheck

      - name: Lint (frontend + server)
        run: npm run lint

      - name: Build (frontend + server)
        run: npm run build

      - name: Test (server)
        run: npm test

      - name: Test (E2E)
        env:
          ENV_FILE: e2e/.env.e2e
          DATABASE_URL: postgresql://wmv:wmv@localhost:5432/wmv_e2e
          WMV_SKIP_DOCKER_STARTUP: "true"
        run: |
          # Bootstrap E2E schema/data using Postgres-only harness scripts.
          bash scripts/ensure-e2e-db.sh
          # Install Playwright Chromium
          npx playwright install chromium
          # Run E2E tests (Playwright webServer boots the backend + frontend)
          npm run test:e2e

      - name: Build Docker image
        run: docker build -t wmv-cycling:ci .

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Railway
        run: |
          echo "Railway deployment configured!"
          echo "Connect your Railway project in the dashboard:"
          echo "1. Go to https://railway.app"
          echo "2. Create new project"
          echo "3. Connect GitHub repo"
          echo "4. Railway will auto-deploy on push to main"
        shell: bash
